apiVersion: v1
kind: Namespace
metadata:
  name: medicore-nexus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicore-backend
  namespace: medicore-nexus
  labels:
    app: medicore-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medicore-backend
  template:
    metadata:
      labels:
        app: medicore-backend
    spec:
      containers:
      - name: backend
        image: medicore-nexus:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: medicore-secrets
              key: database-url
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: medicore-backend-svc
  namespace: medicore-nexus
spec:
  selector:
    app: medicore-backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
